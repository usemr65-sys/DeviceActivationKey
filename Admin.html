<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Device Register Manager</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --input-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius: 12px;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --danger: #ef4444;
            --danger-hover: #f87171;
            --success: #10b981;
            --input-bg: #0f172a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile focused width */
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 24px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: var(--border-color);
        }

        /* Cards & Sections */
        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* Search Bar */
        .search-box {
            position: relative;
        }

        .search-box input {
            padding-left: 36px;
        }

        .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 18px;
            height: 18px;
        }

        /* List Items */
        .device-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .device-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .device-item.selected {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.03);
        }

        .device-checkbox {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .device-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-id {
            font-weight: 700;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-online {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .badge-offline {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .device-detail {
            font-size: 0.825rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            word-break: break-all;
        }

        .device-actions {
            display: flex;
            gap: 4px;
        }

        .bulk-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .select-all-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 24px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <h1><i data-lucide="shield-check"></i> Device Admin</h1>
            <button class="icon-btn" id="themeToggle" title="Toggle Theme">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </header>

        <!-- Form Section (Add / Edit) -->
        <section class="card">
            <div class="card-title">
                <span id="formTitle">Add New Device</span>
                <button class="icon-btn" id="cancelEditBtn" style="display:none;" title="Cancel Edit">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <input type="hidden" id="editIndex" value="-1">

            <div class="form-group">
                <label for="deviceId">Device ID</label>
                <input type="text" id="deviceId" class="form-control" placeholder="e.g. device123" required>
            </div>

            <div class="form-group">
                <label for="key">Key</label>
                <input type="text" id="key" class="form-control" placeholder="e.g. key12345" required>
            </div>

            <div class="form-group">
                <label for="expirydate">Expiry Date</label>
                <input type="text" id="expirydate" class="form-control" placeholder="DD-MM-YYYY" required>
            </div>

            <div class="toggle-group">
                <label for="allowOffline" style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);">Allow Offline</label>
                <label class="switch">
                    <input type="checkbox" id="allowOffline">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn btn-primary" id="saveBtn">
                <i data-lucide="plus-circle" id="saveIcon"></i> <span id="saveBtnText">Register Device</span>
            </button>
        </section>

        <!-- Registered Devices Section -->
        <section class="card">
            <div class="card-title">
                <span>Registered Devices</span>
                <span id="deviceCount" style="font-size: 0.8rem; background: var(--border-color); padding: 2px 8px; border-radius: 10px;">0</span>
            </div>

            <!-- Search -->
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" class="form-control" placeholder="Search by Device ID or Key...">
            </div>

            <!-- Bulk Select Actions -->
            <div class="bulk-actions">
                <label class="select-all-label">
                    <input type="checkbox" id="selectAllCheckbox" class="device-checkbox">
                    <span>Select All</span>
                </label>
                <button class="btn btn-danger" id="deleteSelectedBtn" style="width: auto; padding: 6px 12px; font-size: 0.8rem; display: none;">
                    <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i> Delete Selected (<span id="selectedCount">0</span>)
                </button>
            </div>

            <!-- List Container -->
            <div class="device-list" id="deviceList">
                <!-- Dynamically Populated -->
            </div>

            <!-- Save / Export JSON -->
            <button class="btn btn-outline" id="exportBtn" style="margin-top: 8px;">
                <i data-lucide="download"></i> Save / Export userdata.json
            </button>
        </section>
    </div>

    <script>
        // Default initial data if none found locally
        const defaultData = [
            {
                "device_id": "device123",
                "key": "key12345",
                "expirydate": "31-12-2025",
                "Allowoffline": true
            },
            {
                "device_id": "device456",
                "key": "key67890",
                "expirydate": "15-06-2025",
                "Allowoffline": false
            }
        ];

        // State Management
        let devices = [];
        let selectedIndices = new Set();

        // DOM Elements
        const deviceList = document.getElementById('deviceList');
        const searchInput = document.getElementById('searchInput');
        const deviceIdInput = document.getElementById('deviceId');
        const keyInput = document.getElementById('key');
        const expirydateInput = document.getElementById('expirydate');
        const allowOfflineInput = document.getElementById('allowOffline');
        const editIndexInput = document.getElementById('editIndex');
        const saveBtn = document.getElementById('saveBtn');
        const saveBtnText = document.getElementById('saveBtnText');
        const saveIcon = document.getElementById('saveIcon');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
        const selectedCountSpan = document.getElementById('selectedCount');
        const deviceCountSpan = document.getElementById('deviceCount');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const exportBtn = document.getElementById('exportBtn');

        // Initialization
        async function init() {
            // Load local storage first, fallback to userdata.json or defaultData
            const savedData = localStorage.getItem('userdata_json');
            if (savedData) {
                try {
                    devices = JSON.parse(savedData);
                } catch (e) {
                    devices = defaultData;
                }
            } else {
                try {
                    const response = await fetch('userdata.json');
                    if (response.ok) {
                        devices = await response.json();
                    } else {
                        devices = defaultData;
                    }
                } catch (e) {
                    devices = defaultData;
                }
            }

            saveToLocalStorage();
            renderList();
            initTheme();
        }

        function saveToLocalStorage() {
            localStorage.setItem('userdata_json', JSON.stringify(devices, null, 4));
        }

        // Render List with Filtering
        function renderList() {
            const query = searchInput.value.toLowerCase().trim();
            deviceList.innerHTML = '';

            const filteredDevices = devices.map((dev, originalIndex) => ({ ...dev, originalIndex }))
                .filter(dev => dev.device_id.toLowerCase().includes(query) || dev.key.toLowerCase().includes(query));

            deviceCountSpan.textContent = devices.length;

            if (filteredDevices.length === 0) {
                deviceList.innerHTML = `<div class="empty-state">No registered devices found.</div>`;
                updateBulkActions();
                lucide.createIcons();
                return;
            }

            filteredDevices.forEach(item => {
                const isSelected = selectedIndices.has(item.originalIndex);
                const card = document.createElement('div');
                card.className = `device-item ${isSelected ? 'selected' : ''}`;
                
                card.innerHTML = `
                    <input type="checkbox" class="device-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect(${item.originalIndex})">
                    <div class="device-info">
                        <div class="device-header">
                            <span class="device-id">${escapeHtml(item.device_id)}</span>
                            <span class="badge ${item.Allowoffline ? 'badge-online' : 'badge-offline'}">
                                ${item.Allowoffline ? 'Offline Allowed' : 'Online Only'}
                            </span>
                        </div>
                        <div class="device-detail"><i data-lucide="key" style="width:12px;height:12px;"></i> Key: ${escapeHtml(item.key)}</div>
                        <div class="device-detail"><i data-lucide="calendar" style="width:12px;height:12px;"></i> Expires: ${escapeHtml(item.expirydate)}</div>
                    </div>
                    <div class="device-actions">
                        <button class="icon-btn" onclick="editDevice(${item.originalIndex})" title="Edit"><i data-lucide="edit-2" style="width:16px;height:16px;"></i></button>
                        <button class="icon-btn" onclick="deleteSingleDevice(${item.originalIndex})" title="Delete" style="color:var(--danger);"><i data-lucide="trash" style="width:16px;height:16px;"></i></button>
                    </div>
                `;
                deviceList.appendChild(card);
            });

            updateBulkActions();
            lucide.createIcons();
        }

        // Selection & Bulk Logic
        window.toggleSelect = function(index) {
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
            } else {
                selectedIndices.add(index);
            }
            renderList();
        };

        selectAllCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                devices.forEach((_, idx) => selectedIndices.add(idx));
            } else {
                selectedIndices.clear();
            }
            renderList();
        });

        function updateBulkActions() {
            const count = selectedIndices.size;
            selectedCountSpan.textContent = count;
            deleteSelectedBtn.style.display = count > 0 ? 'flex' : 'none';
            selectAllCheckbox.checked = devices.length > 0 && selectedIndices.size === devices.length;
        }

        deleteSelectedBtn.addEventListener('click', () => {
            if (confirm(`Are you sure you want to delete ${selectedIndices.size} selected item(s)?`)) {
                devices = devices.filter((_, idx) => !selectedIndices.has(idx));
                selectedIndices.clear();
                saveToLocalStorage();
                renderList();
            }
        });

        window.deleteSingleDevice = function(index) {
            if (confirm("Are you sure you want to delete this device?")) {
                devices.splice(index, 1);
                selectedIndices.delete(index);
                saveToLocalStorage();
                renderList();
            }
        };

        // Form Submit (Add/Edit)
        saveBtn.addEventListener('click', () => {
            const device_id = deviceIdInput.value.trim();
            const key = keyInput.value.trim();
            const expirydate = expirydateInput.value.trim();
            const Allowoffline = allowOfflineInput.checked;
            const editIdx = parseInt(editIndexInput.value);

            if (!device_id || !key || !expirydate) {
                alert("Please fill in all required fields.");
                return;
            }

            const payload = { device_id, key, expirydate, Allowoffline };

            if (editIdx >= 0) {
                devices[editIdx] = payload;
            } else {
                devices.push(payload);
            }

            saveToLocalStorage();
            resetForm();
            renderList();
        });

        window.editDevice = function(index) {
            const dev = devices[index];
            deviceIdInput.value = dev.device_id;
            keyInput.value = dev.key;
            expirydateInput.value = dev.expirydate;
            allowOfflineInput.checked = !!dev.Allowoffline;
            editIndexInput.value = index;

            formTitle.textContent = "Edit Device";
            saveBtnText.textContent = "Update Device";
            saveIcon.setAttribute('data-lucide', 'check-circle');
            cancelEditBtn.style.display = 'block';
            lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        cancelEditBtn.addEventListener('click', resetForm);

        function resetForm() {
            deviceIdInput.value = '';
            keyInput.value = '';
            expirydateInput.value = '';
            allowOfflineInput.checked = false;
            editIndexInput.value = -1;

            formTitle.textContent = "Add New Device";
            saveBtnText.textContent = "Register Device";
            saveIcon.setAttribute('data-lucide', 'plus-circle');
            cancelEditBtn.style.display = 'none';
            lucide.createIcons();
        }

        // Export/Save File Manager File
        exportBtn.addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(devices, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "userdata.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        // Search Filter
        searchInput.addEventListener('input', renderList);

        // Theme Toggle
        function initTheme() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon(currentTheme);
        }

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            updateThemeIcon(target);
        });

        function updateThemeIcon(theme) {
            themeIcon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon');
            lucide.createIcons();
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // Run
        init();
    </script>
</body>
</html>
